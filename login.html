<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <script>/* 테마 FOUC 방지 — 저장된 테마를 스타일 로드 전에 적용 */
  try{var t=localStorage.getItem('dg-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — Connect DG</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=2026-09-21a">
  <link rel="stylesheet" href="css/auth.css?v=2026-09-21a">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/touch-icon.png">
  <link rel="icon" href="assets/twl_logo.ico">
</head>
<body class="auth-page">
  <header class="site-header scrolled">
    <div class="header-inner">
      <a href="index.html" class="logo-slot" aria-label="Connect DG 홈"></a>
      <div class="header-actions" style="margin-left:auto">
        <button class="icon-btn theme-toggle" aria-label="테마 전환"></button>
      </div>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="ab-dot"></div>
        <div><b>Connect DG</b><span>AI 기반 위험물 물류 통합 플랫폼</span></div>
      </div>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" data-tab="login" role="tab" type="button">로그인</button>
        <button class="auth-tab" data-tab="signup" role="tab" type="button">회원가입</button>
        <button class="auth-tab" data-tab="reset" role="tab" type="button">비밀번호 찾기</button>
      </div>

      <div id="msg" class="auth-msg" hidden></div>

      <!-- 로그인 -->
      <!-- 로그인은 이메일·사번 모두 허용하므로 type=text (type=email 이면 사번 입력이 브라우저에서 차단됨).
           가입·비밀번호 찾기는 인증코드 메일 발송이 필요해 type=email 유지 -->
      <form id="f-login" class="auth-form">
        <label><span>이메일 또는 사번</span> <input type="text" name="login" autocomplete="username" placeholder="you@company.com 또는 TW190708Z" required></label>
        <label><span>비밀번호</span> <input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn btn-dg btn-block" type="submit">로그인</button>
        <p class="auth-hint">승인된 계정만 로그인할 수 있습니다. 관리자 승인 후 이용하세요.</p>
      </form>

      <!-- 회원가입 -->
      <form id="f-signup" class="auth-form" hidden>
        <label><span>이메일</span> <span class="req">*</span>
          <span class="with-btn">
            <input type="email" name="login" autocomplete="username" placeholder="you@company.com" required>
            <button type="button" class="btn btn-ghost btn-sm" data-send="signup">인증코드 받기</button>
          </span>
        </label>
        <label><span>인증코드</span> <input type="text" name="code" inputmode="numeric" maxlength="6" placeholder="메일로 받은 6자리" required></label>
        <label><span>이름/부서</span> <input type="text" name="name" placeholder="예: 홍길동 / 위험물운영팀"></label>
        <label><span>비밀번호</span> <span class="req">*</span> <input type="password" name="password" autocomplete="new-password" required></label>
        <div class="pw-meter" id="pw-signup" hidden>
          <div class="pw-bar"><span></span></div>
          <div class="pw-label"></div>
          <ul class="pw-checks">
            <li data-k="len">8자 이상</li><li data-k="upper">대문자</li><li data-k="lower">소문자</li><li data-k="digit">숫자</li><li data-k="special">특수문자</li>
          </ul>
        </div>
        <label><span>비밀번호 확인</span> <input type="password" name="password2" autocomplete="new-password" required></label>
        <button class="btn btn-dg btn-block" type="submit">가입 신청</button>
        <p class="auth-hint">가입 신청 후 <b>관리자 승인</b>이 완료되면 로그인할 수 있습니다.</p>
      </form>

      <!-- 비밀번호 찾기 -->
      <form id="f-reset" class="auth-form" hidden>
        <label><span>이메일</span> <span class="req">*</span>
          <span class="with-btn">
            <input type="email" name="login" autocomplete="username" placeholder="you@company.com" required>
            <button type="button" class="btn btn-ghost btn-sm" data-send="reset">인증코드 받기</button>
          </span>
        </label>
        <label><span>인증코드</span> <input type="text" name="code" inputmode="numeric" maxlength="6" placeholder="메일로 받은 6자리" required></label>
        <label><span>새 비밀번호</span> <input type="password" name="password" autocomplete="new-password" required></label>
        <div class="pw-meter" id="pw-reset" hidden>
          <div class="pw-bar"><span></span></div>
          <div class="pw-label"></div>
          <ul class="pw-checks">
            <li data-k="len">8자 이상</li><li data-k="upper">대문자</li><li data-k="lower">소문자</li><li data-k="digit">숫자</li><li data-k="special">특수문자</li>
          </ul>
        </div>
        <button class="btn btn-dg btn-block" type="submit">비밀번호 재설정</button>
      </form>
    </div>
    <p class="auth-foot"><a href="index.html">← 홈으로</a></p>
  </main>

  <script src="js/common.js?v=2026-09-21a"></script>
  <script src="js/i18n-dict.js?v=2026-09-21a"></script>
  <script src="js/i18n.js?v=2026-09-21a"></script>
  <script src="js/auth.js?v=2026-09-21a"></script>
  <!-- 로그인 성공 시 DGSync.markSynced() 호출 — 로컬 잔여 케이스가 타 기기 최신본을 덮어쓰지 않도록 -->
  <script src="js/case-sync.js?v=2026-09-21a"></script>
  <script>
    (function () {
      var A = window.DGAUTH;
      var msg = document.getElementById('msg');
      function show(text, kind) { msg.hidden = false; msg.textContent = (window.DGI18N ? DGI18N.t(text) : text); msg.className = 'auth-msg ' + (kind || ''); }
      function clearMsg() { msg.hidden = true; }

      /* 탭 전환 */
      document.querySelectorAll('.auth-tab').forEach(function (t) {
        t.addEventListener('click', function () {
          document.querySelectorAll('.auth-tab').forEach(function (x) { x.classList.remove('active'); });
          t.classList.add('active'); clearMsg();
          ['login', 'signup', 'reset'].forEach(function (k) { document.getElementById('f-' + k).hidden = (k !== t.dataset.tab); });
        });
      });

      /* 비밀번호 강도 미터 */
      function bindMeter(formId, meterId) {
        var f = document.getElementById(formId), box = document.getElementById(meterId);
        var input = f.querySelector('input[name="password"]');
        input.addEventListener('input', function () {
          var v = input.value; box.hidden = !v;
          var s = A.pwStrength(v);
          box.querySelector('.pw-bar span').style.width = (s.score * 20) + '%';
          box.querySelector('.pw-bar span').style.background = s.color;
          box.querySelector('.pw-label').textContent = (window.DGI18N ? DGI18N.t('강도') : '강도') + ': ' + (window.DGI18N ? DGI18N.t(s.label) : s.label) + (s.checks.special ? '' : ' · ' + (window.DGI18N ? DGI18N.t('특수문자 필요') : '특수문자 필요'));
          box.querySelector('.pw-label').style.color = s.color;
          box.querySelectorAll('.pw-checks li').forEach(function (li) { li.classList.toggle('on', !!s.checks[li.dataset.k]); });
        });
      }
      bindMeter('f-signup', 'pw-signup'); bindMeter('f-reset', 'pw-reset');

      /* 인증코드 발송 (30초 재발송 대기) */
      document.querySelectorAll('[data-send]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var form = btn.closest('form'); var login = form.login.value.trim();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(login)) { show('이메일 형식을 확인하세요.', 'err'); return; }
          btn.disabled = true; btn.textContent = window.DGI18N ? DGI18N.t('발송중…') : '발송중…';
          var send = btn.dataset.send === 'reset' ? A.resetSendCode(login) : A.signupSendCode(login);
          send.then(function (r) {
            if (r && r.ok) { show('인증코드를 메일로 보냈습니다. 10분 내 입력하세요.', 'ok'); }
            else { show(r && r.error ? r.error : '발송 실패 — 인증 백엔드가 아직 활성화되지 않았을 수 있습니다.', 'err'); }
          }).finally(function () {
            var n = 30; btn.textContent = (window.DGI18N ? DGI18N.t('재발송') : '재발송') + '(' + n + ')';
            var iv = setInterval(function () {
              n--; btn.textContent = (window.DGI18N ? DGI18N.t('재발송') : '재발송') + '(' + n + ')';
              if (n <= 0) { clearInterval(iv); btn.disabled = false; btn.textContent = window.DGI18N ? DGI18N.t('인증코드 받기') : '인증코드 받기'; }
            }, 1000);
          });
        });
      });

      /* 로그인 */
      document.getElementById('f-login').addEventListener('submit', function (e) {
        e.preventDefault(); clearMsg();
        var f = e.target;
        A.login(f.login.value.trim(), f.password.value).then(function (r) {
          if (r && r.ok) { show('로그인 성공. 이동합니다…', 'ok'); setTimeout(function () { location.href = (r.role === 'admin') ? 'admin.html' : 'process.html'; }, 500); }
          else { show(r && r.error ? r.error : '로그인 실패', 'err'); }
        });
      });

      /* 회원가입 */
      document.getElementById('f-signup').addEventListener('submit', function (e) {
        e.preventDefault(); clearMsg();
        var f = e.target;
        var s = A.pwStrength(f.password.value);
        if (!s.ok) { show('비밀번호는 8자 이상 + 특수문자를 포함해야 합니다.', 'err'); return; }
        if (f.password.value !== f.password2.value) { show('비밀번호 확인이 일치하지 않습니다.', 'err'); return; }
        A.signup(f.login.value.trim(), f.password.value, f.code.value.trim(), f.name.value.trim()).then(function (r) {
          if (r && r.ok) { show('가입 신청 완료! 관리자 승인 후 로그인할 수 있습니다.', 'ok'); f.reset(); }
          else { show(r && r.error ? r.error : '가입 실패', 'err'); }
        });
      });

      /* 비밀번호 재설정 */
      document.getElementById('f-reset').addEventListener('submit', function (e) {
        e.preventDefault(); clearMsg();
        var f = e.target;
        var s = A.pwStrength(f.password.value);
        if (!s.ok) { show('비밀번호는 8자 이상 + 특수문자를 포함해야 합니다.', 'err'); return; }
        A.reset(f.login.value.trim(), f.code.value.trim(), f.password.value).then(function (r) {
          if (r && r.ok) { show('비밀번호가 재설정되었습니다. 로그인해 주세요.', 'ok'); document.querySelector('.auth-tab[data-tab="login"]').click(); }
          else { show(r && r.error ? r.error : '재설정 실패', 'err'); }
        });
      });
    })();
  </script>
</body>
</html>
