<head>
  <script>/* 테마 FOUC 방지 — 저장된 테마를 스타일 로드 전에 적용 */
  try{var t=localStorage.getItem('dg-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 케이스 — 서버 보관함 | Connect DG</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=2026-09-18a">
  <link rel="stylesheet" href="css/auth.css?v=2026-09-18a">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/touch-icon.png">
  <link rel="icon" href="assets/twl_logo.ico">
</head>
<body class="auth-page">
  <header class="site-header scrolled">
    <div class="header-inner">
      <a href="index.html" class="logo-slot" aria-label="Connect DG 홈"></a>
      <button class="nav-burger" aria-label="메뉴 열기" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav class="site-nav" aria-label="주요 메뉴">
        <a href="process.html">프로세스</a>
        <a href="msds.html">MSDS 분석</a>
        <a href="compliance.html">적법성 검토</a>
        <a href="matching.html">창고·차량 매칭</a>
        <a href="route.html">안전경로</a>
        <a href="dispatch.html">배차·입고</a>
        <a href="insight.html">시장 현황</a>
        <a href="verify.html">구현·검증</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn theme-toggle" aria-label="테마 전환"></button>
      </div>
    </div>
  </header>

  <main class="container admin-wrap">
    <div class="page-head">
      <h1>내 케이스 — 서버 보관함</h1>
      <p>로그인 계정으로 저장된 케이스를 다른 기기에서도 열 수 있습니다. 케이스가 진행될 때마다 자동으로 서버에 동기화됩니다.</p>
    </div>

    <div class="admin-toolbar">
      <button class="btn btn-dg btn-sm" id="pushBtn" type="button">현재 케이스 지금 동기화</button>
      <button class="btn btn-ghost btn-sm" id="reload" type="button">새로고침</button>
      <span class="case-sync-badge" data-sync-status></span>
    </div>

    <div id="caseMsg" class="auth-msg" hidden></div>
    <div class="tbl-card" style="overflow-x:auto">
      <table class="admin-tbl">
        <thead><tr><th>케이스 번호</th><th>화주사</th><th>품목</th><th>판정</th><th>창고</th><th>마지막 저장</th><th class="ta-r">관리</th></tr></thead>
        <tbody id="caseRows"><tr><td colspan="7" class="muted" style="text-align:center;padding:24px">불러오는 중…</td></tr></tbody>
      </table>
    </div>
    <p class="auth-hint" style="margin-top:12px;">'열기'는 서버 케이스를 이 브라우저의 현재 케이스로 복원합니다(현재 작업 중 케이스는 덮어씀).</p>
  </main>

  <script src="js/common.js?v=2026-09-18a"></script>
  <script src="js/i18n-dict.js?v=2026-09-18a"></script>
  <script src="js/i18n.js?v=2026-09-18a"></script>
  <script src="js/auth.js?v=2026-09-18a"></script>
  <script src="js/auth-gate.js?v=2026-09-18a"></script>
  <script src="js/case-sync.js?v=2026-09-18a"></script>
  <script>
    (function () {
      var A = window.DGAUTH, S = window.DGSync;
      var rows = document.getElementById('caseRows'), msg = document.getElementById('caseMsg');
      /* 판정 문구는 사이트 공통(js/common.js VERDICT)과 동일하게 — 화면 간 표기 불일치·미번역 방지 */
      var VD = { OK: '적합', COND: '조건부 검토', REVIEW: '전문가 확인 필요', NO: '보관 불가' };
      function show(t, k) { msg.hidden = false; msg.textContent = (window.DGI18N ? DGI18N.t(t) : t); msg.className = 'auth-msg ' + (k || ''); setTimeout(function () { msg.hidden = true; }, 3500); }
      function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

      /* 로그인 확인 */
      if (!A.isAuthed()) { location.replace('login.html'); return; }
      A.validate().then(function (ok) {
        if (!ok) { location.replace('login.html'); return; }
        load();
      });

      document.getElementById('reload').onclick = load;
      document.getElementById('pushBtn').onclick = function () {
        S.push().then(function (r) {
          if (r && r.ok) { show('현재 케이스를 동기화했습니다.', 'ok'); load(); }
          else { show('동기화할 케이스가 없거나 실패했습니다.', 'err'); }
        });
      };

      function load() {
        rows.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">불러오는 중…</td></tr>';
        S.list().then(function (r) {
          if (!Array.isArray(r)) { show(r && r.error ? r.error : '목록 조회 실패 — 케이스 동기화 백엔드가 아직 활성화되지 않았을 수 있습니다.', 'err'); rows.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">조회 실패</td></tr>'; return; }
          render(r);
        });
      }
      function render(list) {
        if (!list.length) { rows.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">저장된 케이스가 없습니다. 프로세스 화면에서 케이스를 진행하면 자동 저장됩니다.</td></tr>'; return; }
        rows.innerHTML = list.map(function (c) {
          var d = c.updatedAt ? new Date(c.updatedAt) : null;
          function p(n) { return String(n).padStart(2, '0'); }
          var ds = d ? (d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes())) : '—';
          var v = c.verdict ? '<span class="st-pill st-' + (c.verdict === 'OK' ? 'approved' : c.verdict === 'NO' ? 'rejected' : 'pending') + '">' + (VD[c.verdict] || esc(c.verdict)) + '</span>' : '<span class="muted">—</span>';
          return '<tr><td><b>' + esc(c.caseNo) + '</b></td><td>' + esc(c.shipper || '—') + '</td><td>' + esc(c.item || '—') + '</td>' +
            '<td>' + v + '</td><td>' + esc(c.warehouseId || '—') + '</td><td>' + ds + '</td>' +
            '<td class="ta-r"><div class="row-act">' +
              '<button class="btn btn-dg btn-xs" data-act="open" data-no="' + esc(c.caseNo) + '" type="button">열기</button>' +
              '<button class="btn btn-ghost btn-xs" data-act="del" data-no="' + esc(c.caseNo) + '" type="button">삭제</button>' +
            '</div></td></tr>';
        }).join('');
        rows.querySelectorAll('[data-act]').forEach(function (b) {
          b.onclick = function () {
            var no = b.dataset.no;
            if (b.dataset.act === 'open') {
              if (!confirm('서버 케이스 ' + no + ' 를 현재 케이스로 복원할까요? 현재 작업 중인 케이스는 덮어씁니다.')) return;
              S.restore(no).then(function (r) {
                if (r && r.ok) { show('복원했습니다. 프로세스 화면으로 이동합니다…', 'ok'); setTimeout(function () { location.href = 'process.html'; }, 600); }
                else { show(r && r.error ? r.error : '복원 실패', 'err'); }
              });
            } else {
              if (!confirm('서버에 저장된 케이스 ' + no + ' 를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
              S.remove(no).then(function (r) {
                if (r && r.ok) { show('삭제했습니다.', 'ok'); load(); }
                else { show(r && r.error ? r.error : '삭제 실패', 'err'); }
              });
            }
          };
        });
      }
    })();
  </script>
</body>
</html>
